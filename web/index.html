<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f8f8f5" />
  <meta name="description" content="KiyoEdu kết nối nhà trường, giáo viên, học sinh và phụ huynh. Quản lý học sinh 360°, Sổ điểm điện tử Thông tư 22/2021/TT-BGDĐT, Đấu trường tri thức trực tuyến và Sổ liên lạc di động Android." />
  <meta property="og:title" content="KiyoEdu — Nền tảng Giáo dục Số Hiện đại" />
  <meta property="og:description" content="Hệ sinh thái công nghệ giáo dục hiện đại, kết nối nhà trường, giáo viên, học sinh và phụ huynh." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>KiyoEdu — Nền tảng Giáo dục Số Hiện đại & Hệ sinh thái Học đường</title>
  <!-- Anti-Adware & Rogue Extension Shield -->
  <script>
    (function() {
      function isRogueNode(node) {
        if (!node || node.nodeType !== 1) return false;
        var tag = (node.tagName || '').toLowerCase();
        if (tag === 'iframe' || tag === 'embed' || tag === 'object') {
          var src = (node.src || node.getAttribute('src') || '').toLowerCase();
          if (src.indexOf('tiktok') !== -1 || src.indexOf('douyin') !== -1 || src.indexOf('urban-vpn') !== -1) return true;
        }
        var cls = (node.className || '');
        if (typeof cls === 'string' && (cls.indexOf('tiktok-embed') !== -1 || cls.indexOf('douyin-embed') !== -1)) return true;
        if (node.hasAttribute && (node.hasAttribute('data-video-id') || (node.id && node.id.indexOf('tiktok') !== -1))) return true;
        return false;
      }
      function purgeRogueElements(root) {
        if (!root) return;
        if (isRogueNode(root)) { try { root.remove(); } catch (e) {} return; }
        if (root.querySelectorAll) {
          try {
            var bad = root.querySelectorAll('iframe[src*="tiktok"], iframe[src*="douyin"], iframe[src*="urban-vpn"], blockquote.tiktok-embed, div[id*="tiktok-embed"], .tiktok-embed');
            for (var i = 0; i < bad.length; i++) bad[i].remove();
          } catch (e) {}
        }
      }
      var origAppend = Element.prototype.appendChild;
      Element.prototype.appendChild = function(child) {
        if (isRogueNode(child)) return child;
        return origAppend.apply(this, arguments);
      };
      var origInsert = Element.prototype.insertBefore;
      Element.prototype.insertBefore = function(newNode, refNode) {
        if (isRogueNode(newNode)) return newNode;
        return origInsert.apply(this, arguments);
      };
      if (typeof MutationObserver !== 'undefined') {
        var obs = new MutationObserver(function(mutations) {
          for (var m = 0; m < mutations.length; m++) {
            var added = mutations[m].addedNodes;
            for (var a = 0; a < added.length; a++) purgeRogueElements(added[a]);
          }
        });
        document.addEventListener('DOMContentLoaded', function() {
          if (document.documentElement) obs.observe(document.documentElement, { childList: true, subtree: true });
        });
      }
    })();
  </script>
</head>
<body>
  <noscript>Trải nghiệm này cần JavaScript. Vui lòng bật JavaScript để xem KiyoEdu.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
